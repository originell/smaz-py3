[build-system]
requires = ['setuptools>=64']
build-backend = 'setuptools.build_meta'

[project]
name = "smaz-py3"
version = "1.1.4"
description = "Small string compression using smaz, supports Python 3."
authors = [
    {name = "Luis Nell", email = "luis@originell.org"}
]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
keywords = ["smaz", "string", "compression"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/originell/smaz-py3"
Documentation = "https://github.com/originell/smaz-py3/blob/main/README.md"
Repository = "https://github.com/originell/smaz-py3.git"
Changelog = "https://github.com/originell/smaz-py3/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.142.1",
    "ipdb>=0.13.13",
    "ipython>=8.37.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.14.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.142.1",
    "ipdb>=0.13.13",
    "ipython>=8.37.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.14.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
ext-modules = [
    {name = "smaz", sources = ["smazmodule.c", "smaz/smaz.c"]}
]
