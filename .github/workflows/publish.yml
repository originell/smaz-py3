name: Publish

on:
  release:
    types: [ published ]

# Thanks to pybase64 for having a great build process to steal from.
jobs:
  build_wheels:
    name: Build ${{ matrix.archs }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archs: "x86_64, i686"
          - os: ubuntu-latest
            archs: "aarch64"
          - os: ubuntu-latest
            archs: "ppc64le"
          - os: ubuntu-latest
            archs: "s390x"
          - os: windows-latest
            archs: "AMD64"
          - os: windows-latest
            archs: "x86"
          - os: macos-latest
            archs: "x86_64, arm64"
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.12.0
        env:
          CIBW_ARCHS: "${{ matrix.archs }}"
      - uses: actions/upload-artifact@v3
        with:
          path: ./wheelhouse/*.whl
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        id: env
        run: |
          uv python install 3.10
          uv sync --python 3.10 --frozen
          echo "python=${PWD}/.venv/bin/python" >> "$GITHUB_OUTPUT"
      - name: Install build backend
        run: uv run --python 3.10 python -m pip install build
      - name: Build sdist
        run: uv run --python 3.10 python -m build --sdist
      - name: Test sdist
        run: |
          set -exuo pipefail
          mkdir from_source
          pushd from_source
          tar -xf ../dist/smaz*.tar.gz
          pushd smaz*
          # make extension mandatory
          export CIBUILDWHEEL=1
          # build extension
          "${{ steps.env.outputs.python }}" setup.py build_ext -i -f
          # test
          "${{ steps.env.outputs.python }}" -m pytest
          popd
          popd
      - uses: actions/upload-artifact@v3
        with:
          path: dist/*.tar.gz
  upload_test_pypi:
    name: Upload to Test PyPI
    needs: [ build_wheels, build_sdist ]
    runs-on: ubuntu-latest
    if: github.repository == 'originell/smaz-py3'
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: artifact
          path: dist
      - name: Upload to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TEST_TOKEN }}
          skip_existing: true
          repository_url: https://test.pypi.org/legacy/
  test_install_linux:
    needs: [ upload_test_pypi ]
    name: Test install on Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python-version }}
        id: python
        run: |
          PY="${{ matrix.python-version }}"
          uv python install "$PY"
          echo "path=$(uv python find "$PY")" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          PYTHON="${{ steps.python.outputs.path }}"
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple smaz-py3
          "$PYTHON" -c "import smaz; print(smaz.compress('foobar'))"

  test_install_windows:
    needs: [ upload_test_pypi ]
    name: Test install on Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Test
        run: |
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple smaz-py3
          python -c "import smaz; print(smaz.compress('foobar'))"

  upload_pypi:
    name: Upload to PyPI
    needs: [ test_install_linux, test_install_windows, build_wheels, build_sdist ]
    runs-on: ubuntu-latest
    if: github.repository == 'originell/smaz-py3'
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: artifact
          path: dist
      - name: Upload to PyPI
        # upload to PyPI on every tag starting with 'v'
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_RELEASE_TOKEN }}
          skip_existing: true
